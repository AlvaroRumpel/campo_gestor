include: package:flutter_lints/flutter.yaml

# custom_lint enables riverpod_lint (added in Plan 03 dev_dependencies).
analyzer:
  plugins:
    - custom_lint
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - ".dart_tool/**"

linter:
  rules:
    # Project conventions (additive on top of flutter_lints).
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    require_trailing_commas: true
    sort_pub_dependencies: false  # we group by purpose in pubspec.yaml comments
